<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Peta workshop AI untuk belajar dan mengajar</title>
  <desc id="desc">Pahami konsep AI dan tulis prompt. Praktikkan Study Buddy, Creative Studio, dan Teaching Assistant. Periksa fakta, privasi, dan kesesuaian hasil bersama guru sebelum digunakan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="530" rx="24" fill="#f1f5f9"/>
  <text x="48" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Belajar, berkarya, mengajar - dengan kendali manusia</text>
  <text x="48" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">Peta praktik workshop GDA | Diagram konseptual, bukan tangkapan layar produk</text>
  <rect x="48" y="208" width="255" height="126" rx="16" fill="#0f172a"/>
  <text x="72" y="245" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">1. Pahami dan arahkan</text>
  <text x="72" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e2e8f0">Konsep AI + prompt jelas</text>
  <text x="72" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e2e8f0">Tujuan, konteks, sumber, format</text>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M303 271 H340 V186 H376"/><path d="M303 271 H376"/><path d="M303 271 H340 V356 H376"/>
    <path d="M758 186 H793 V271 H839"/><path d="M758 271 H839"/><path d="M758 356 H793 V271 H839"/>
  </g>
  <rect x="382" y="151" width="370" height="70" rx="13" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="406" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#134e4a">Study Buddy</text>
  <text x="406" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#134e4a">Pahami konsep, jawab sendiri, latihan</text>
  <rect x="382" y="236" width="370" height="70" rx="13" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="406" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#4c1d95">Creative Studio</text>
  <text x="406" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#4c1d95">Ide kampanye, ilustrasi, poster</text>
  <rect x="382" y="321" width="370" height="70" rx="13" fill="#fef3c7" stroke="#b45309"/>
  <text x="406" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#78350f">Teaching Assistant</text>
  <text x="406" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#78350f">Rencana, soal, rubrik, diferensiasi</text>
  <rect x="845" y="208" width="307" height="126" rx="16" fill="#0f766e"/>
  <text x="868" y="245" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">3. Periksa sebelum pakai</text>
  <text x="868" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ffffff">Fakta, privasi, kesesuaian</text>
  <text x="868" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ffffff">Guru dan siswa tetap berpikir</text>
  <rect x="48" y="432" width="1104" height="59" rx="12" fill="#ffffff"/>
  <text x="72" y="470" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#334155">AI membantu menghasilkan draf. Manusia memeriksa, memperbaiki, dan bertanggung jawab.</text>
